name: checks
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scanner self-test (positive controls)
        run: python check.py --selftest
      - name: repository hygiene scan
        run: python check.py
  selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the OpenLobby core: polcore (the database layer) and tools/pgtest.py,
      # which gives the database suites a throwaway PostgreSQL in Docker
      - uses: actions/checkout@v4
        with:
          repository: PrettyOpenLobby/OpenLobby
          path: openlobby
      - run: pip install pillow "psycopg[binary]" psycopg-pool valkey
      - run: python tools/gen_blowfish_tables.py
      - run: python tools/fmo_run_all.py
        env:
          OPENLOBBY_DIR: ${{ github.workspace }}/openlobby
          POL_TEST_REQUIRE_DB: "1"
