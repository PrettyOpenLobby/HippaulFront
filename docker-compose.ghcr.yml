# Run the published images instead of building. Apply ON TOP of
# docker-compose.yml, in OpenLobby's project like it (from this directory):
#
#   docker compose --project-directory ../openlobby \
#       --env-file ../openlobby/.env --env-file .env \
#       -f ../openlobby/docker-compose.yml -f docker-compose.yml \
#       -f docker-compose.ghcr.yml up -d fmo
#
# The image carries the cipher tables; your generated services/fmodata/ and
# the baked board art are mounted over the image's copies, so step 2 of the
# README still runs on the host. Relative paths resolve against ../openlobby.
# Needs Docker Compose 2.24 or newer (the `!reset` that drops the build step).

services:
  fmo:
    image: ghcr.io/prettyopenlobby/crystalfront:${CRYSTALFRONT_TAG:-latest}
    pull_policy: missing
    build: !reset null
    volumes:
      - ../crystalfront/services/fmodata:/app/fmodata:ro
  board:
    image: ghcr.io/prettyopenlobby/crystalfront:${CRYSTALFRONT_TAG:-latest}
    pull_policy: missing
    volumes:
      - ../crystalfront/services/fmodata:/app/fmodata:ro
      - ../crystalfront/services/boardart/fmo:/app/boardart/fmo:ro
