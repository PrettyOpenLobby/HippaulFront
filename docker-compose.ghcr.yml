# Run the published images instead of building. Apply ON TOP of
# docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# (or COMPOSE_FILE=docker-compose.yml:docker-compose.ghcr.yml in .env, then
# plain `docker compose up -d`). The image carries the cipher tables; your
# generated services/fmodata/ and the baked board art are mounted over the
# image's copies, so steps 2 of the README still run on the host. Needs Docker
# Compose 2.24 or newer (the `!reset` that drops the build step).

services:
  fmo:
    image: ghcr.io/prettyopenlobby/crystalfront:${CRYSTALFRONT_TAG:-latest}
    pull_policy: missing
    build: !reset null
    volumes:
      - ./services/fmodata:/app/fmodata:ro
  board:
    image: ghcr.io/prettyopenlobby/crystalfront:${CRYSTALFRONT_TAG:-latest}
    pull_policy: missing
    volumes:
      - ./services/fmodata:/app/fmodata:ro
      - ./services/boardart/fmo:/app/boardart/fmo:ro
