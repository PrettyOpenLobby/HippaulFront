# The Front Mission Online title plugin for the OpenLobby core. This file is
# an OVERRIDE of OpenLobby's compose file, not a stack of its own: the plugin
# runs inside the core's login and authsess processes, so it is applied on
# top of OpenLobby's compose file, in OpenLobby's project. The game service
# stays in this repository's own docker-compose.yml.
#
# With both repositories checked out side by side, from this directory:
#
#   docker compose --project-directory ../openlobby \
#       -f ../openlobby/docker-compose.yml -f docker-compose.title.yml \
#       up -d --build login authsess
#
# Without it the game plays the same; only the Viewer's profile screen for a
# Front Mission Content ID stays empty.
#
# Stacking titles: every title image is the core image plus one plugin, so
# to run several, build each on the previous one (OPENLOBBY_IMAGE) and list
# them all in POL_TITLES, e.g. POL_TITLES=tmtitle,fmotitle in .env.

services:
  login:
    image: crystalfront-title:latest
    build:
      context: ../crystalfront
      dockerfile: Dockerfile.title
      args:
        OPENLOBBY_IMAGE: "${OPENLOBBY_IMAGE:-openlobby:latest}"
    pull_policy: build
    environment:
      POL_TITLES: "${POL_TITLES:-fmotitle}"
      # the pilot database the game writes, on the shared data volume
      FMO_DB: "${FMO_DB:-/data/fmo.db}"

  authsess:
    image: crystalfront-title:latest
    pull_policy: never
    environment:
      POL_TITLES: "${POL_TITLES:-fmotitle}"
      FMO_DB: "${FMO_DB:-/data/fmo.db}"
